name: CI/CD MLflow
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
env:
  CSV_URL: "MLproject/train_pca.csv"
  TARGET_VAR: "Credit_Score"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # Checks-out your repository under $GITHUB_WORKSPACE
    - uses: actions/checkout@v3
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: 3.12.7
        
    - name: Check Env
      run: |
        echo $CSV_URL
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow
    - name: Run MLflow Project
      run: |
        mlflow run MLproject --env-manager=local
    - name: Get latest MLflow run_id
      run: |
        import mlflow
        import os
        runs = mlflow.search_runs(experiment_ids=["0"], max_results=1, order_by=["attributes.start_time DESC"])

        if not runs.empty:
          run_id = runs.iloc[0]["run_id"]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
            f.write(f"RUN_ID={run_id}\n")
          print(f"Successfully found Run ID: {run_id}")
        else:
          print("No runs found in MLflow tracking!")
          exit(1)
        shell: python
    - name: Build Docker Model
      run: |
        mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "cc"
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    - name: Tag Docker Image
      run: |
        docker tag cc ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/cc:latest
